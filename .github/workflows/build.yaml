name: Build

on:
  workflow_dispatch: 

jobs:
  build:
    name: Build for multiple platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-debian
          - goos: windows
            goarch: amd64
            platform: windows
          - goos: darwin
            goarch: amd64
            platform: macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -o golang_release-${{ matrix.platform }}.exe main.go
          else
            go build -o golang_release-${{ matrix.platform }} main.go
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: golang_release-${{ matrix.platform }}
          path: golang_release-${{ matrix.platform }}*
